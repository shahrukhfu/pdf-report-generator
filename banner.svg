<svg fill="none" viewBox="0 0 800 200" width="100%" height="200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 200px;
          border-radius: 12px;
          background: linear-gradient(-45deg, #0f172a, #1e1b4b, #0f172a, #1e293b);
          background-size: 400% 400%;
          animation: gradient 10s ease infinite;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          color: #ffffff;
          text-align: center;
          padding: 0 20px;
          box-sizing: border-box;
          border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes gradient {
          0% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
          100% { background-position: 0% 50%; }
        }

        .title {
          font-size: 32px;
          font-weight: 800;
          letter-spacing: 2px;
          background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc, #38bdf8);
          background-size: 200% auto;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: textShine 4s linear infinite;
          margin-bottom: 8px;
        }

        @keyframes textShine {
          to { background-position: 200% center; }
        }

        .subtitle {
          font-size: 14px;
          color: #94a3b8;
          font-weight: 500;
          letter-spacing: 1px;
          text-transform: uppercase;
        }

        .badges {
          display: flex;
          gap: 12px;
          margin-top: 16px;
        }

        .badge {
          background: rgba(255, 255, 255, 0.08);
          padding: 6px 14px;
          border-radius: 20px;
          font-size: 11px;
          font-weight: 600;
          color: #38bdf8;
          border: 1px solid rgba(56, 189, 248, 0.3);
          transition: all 0.3s ease;
        }
      </style>

      <div class="container">
        <div class="title">PDF REPORT GENERATOR</div>
        <div class="subtitle">FastAPI &amp; Playwright Chromium Automated Pipeline</div>
        <div class="badges">
          <span class="badge">FASTAPI</span>
          <span class="badge">PLAYWRIGHT</span>
          <span class="badge">SQLITE3</span>
          <span class="badge">STORE &amp; LINK</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
